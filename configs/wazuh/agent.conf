# Wazuh Agent Configuration

## Overview

This file documents the configuration used for the Wazuh agent deployed on Apache1.

The Wazuh agent allows Apache1 to communicate with the Wazuh Manager and send security-related events for centralized monitoring.

## Agent Role

The Wazuh agent installed on Apache1 is responsible for:

- Collecting system events.
- Monitoring log files.
- Sending security information to the Wazuh Manager.
- Allowing endpoint visibility from the Wazuh Dashboard.

## Agent Architecture

```
Apache1 Server

      |
      |
      v

Wazuh Agent

      |
      |
      v

Wazuh Manager

      |
      |
      v

Wazuh Dashboard
```

## Configuration Location

The main Wazuh agent configuration file is:

```
/var/ossec/etc/ossec.conf
```

## Manager Communication

The agent is configured to communicate with the Wazuh Manager.

Configuration parameters:

```
Manager Address:
<WAZUH_SERVER_IP>

Communication Protocol:
TCP

Port:
1514
```

## Agent Registration

Before communication starts, Apache1 must be registered on the Wazuh Manager.

The registration process allows:

- The Wazuh Manager to identify Apache1.
- Secure communication between agent and manager.
- Event collection from the endpoint.

## Agent Service Management

Start the Wazuh agent:

```bash
sudo systemctl start wazuh-agent
```

Enable the agent at system startup:

```bash
sudo systemctl enable wazuh-agent
```

Check agent status:

```bash
sudo systemctl status wazuh-agent
```

Restart agent after configuration changes:

```bash
sudo systemctl restart wazuh-agent
```

## Monitored Data

The agent collects information such as:

- System logs.
- Authentication events.
- Service activity.
- Security-related events.

## Verification

The agent status can be verified from the Wazuh Dashboard.

Expected result:

- Apache1 appears in the agent list.
- Agent status is active.
- Events are received from Apache1.

