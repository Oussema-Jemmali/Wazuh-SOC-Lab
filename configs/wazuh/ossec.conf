<!--
Wazuh Agent Configuration Reference

This file represents a sanitized example of the Wazuh agent configuration
used on Apache1 in the SOC laboratory.

Sensitive information such as manager IP addresses and authentication keys
must not be published in a public repository.
-->

<ossec_config>

  <!-- Client communication configuration -->
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <config-profile>ubuntu</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>


  <!-- Log collection configuration -->
  <localfile>

    <!-- System authentication logs -->
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>

  </localfile>


  <localfile>

    <!-- System activity logs -->
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>

  </localfile>


  <!-- File integrity monitoring -->
  <syscheck>

    <disabled>no</disabled>

    <directories check_all="yes">
      /etc
      /usr/bin
      /usr/sbin
    </directories>

  </syscheck>


  <!-- Rootkit detection -->
  <rootcheck>

    <disabled>no</disabled>

  </rootcheck>


  <!-- Active response -->
  <active-response>

    <disabled>no</disabled>

  </active-response>


  <!-- Logging settings -->
  <logging>

    <log_format>plain</log_format>

  </logging>

</ossec_config>